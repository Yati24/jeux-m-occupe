{% extends "base.html" %}

{% block title %}Inscription - Jeux m'occupe{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold mb-8">Inscription</h1>

    <form id="register-form" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold mb-2">Prénom</label>
                <input type="text" name="first_name" class="input">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-2">Nom</label>
                <input type="text" name="last_name" class="input">
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Nom d'utilisateur</label>
            <input type="text" name="username" class="input" required>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Email</label>
            <input type="email" name="email" class="input" required>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Mot de passe</label>
            <input type="password" name="password" class="input" required>
        </div>

        <button type="submit" class="btn-primary w-full py-2">S'inscrire</button>
    </form>

    <p class="text-center mt-4">
        Vous avez un compte ? <a href="/login" class="text-blue-600 hover:underline">Se connecter</a>
    </p>
</div>

<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password'),
                first_name: formData.get('first_name'),
                last_name: formData.get('last_name')
            })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.href = '/';
        } else {
            alert('Erreur lors de l\'inscription');
        }
    });
</script>
{% endblock %}
