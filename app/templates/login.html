{% extends "base.html" %}

{% block title %}Connexion | Jeux m'occupe{% endblock %}
{% block meta_robots %}noindex, nofollow{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold mb-8">Connexion</h1>

    <form id="login-form" class="space-y-4">
        <div>
            <label class="block text-sm font-semibold mb-2">Email</label>
            <input type="email" name="email" class="input" required>
        </div>

        <div>
            <label class="block text-sm font-semibold mb-2">Mot de passe</label>
            <input type="password" name="password" class="input" required>
        </div>

        <button type="submit" class="btn-primary w-full py-2">Se connecter</button>
    </form>

    <p class="text-center mt-4">
        Pas de compte ? <a href="/register" class="text-blue-600 hover:underline">S'inscrire</a>
    </p>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: formData.get('email'),
                password: formData.get('password')
            })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.href = '/';
        } else {
            alert('Identifiants invalides');
        }
    });
</script>
{% endblock %}
