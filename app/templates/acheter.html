{% extends "base.html" %}

{% block title %}Acheter - Jeux m'occupe{% endblock %}

{% block content %}
<!-- Page Header - Black Section -->
<section class="hero-section hero-dark relative mb-12">
    <div class="header-container py-6">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-2">Catalogue</h1>
        <p id="catalog-subtitle" class="text-lg text-gray-300">Chargement...</p>
    </div>
</section>

<!-- Main Layout with Filters on Left -->
<div class="header-container mb-12">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
        <!-- Filters Sidebar -->
        <div class="lg:col-span-1">
            <div class="space-y-6 sticky top-24">
                <!-- Prix Filter -->
                <div>
                    <h3 class="font-bold text-gray-900 mb-4">Prix</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-gray-600 mb-2">Minimum</label>
                            <input type="number" id="min-price" class="input text-sm w-full" placeholder="0" min="0">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-2">Maximum</label>
                            <input type="number" id="max-price" class="input text-sm w-full" placeholder="1000" min="0">
                        </div>
                    </div>
                </div>

                <!-- Catégorie Filter -->
                <div>
                    <h3 class="font-bold text-gray-900 mb-4">Catégorie</h3>
                    <select id="category-filter" class="input text-sm w-full">
                        <option value="">Toutes les catégories</option>
                        <option value="Pour les petits">Pour les petits</option>
                        <option value="En famille">En famille</option>
                        <option value="Jeux expertes">Jeux expertes</option>
                    </select>
                </div>

                <!-- Mécanique Filter -->
                <div>
                    <h3 class="font-bold text-gray-900 mb-4">Mécanique</h3>
                    <div class="space-y-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="mechanic-competitif" class="w-4 h-4 rounded" value="Compétitif">
                            <span class="text-sm text-gray-600">Compétitif</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="mechanic-strategie" class="w-4 h-4 rounded" value="Stratégie">
                            <span class="text-sm text-gray-600">Stratégie</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="mechanic-ambiance" class="w-4 h-4 rounded" value="Ambiance">
                            <span class="text-sm text-gray-600">Ambiance</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Products Grid on Right -->
        <div class="lg:col-span-3">
            <div id="products-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-12">
                <!-- Loaded by JS -->
            </div>

            <!-- Pagination -->
            <div id="pagination" class="flex justify-center gap-2 mb-8">
                <!-- Loaded by JS -->
            </div>
        </div>
    </div>
</div>

<script>
    let currentPage = 1;
    const perPage = 6; // 2 colonnes x 3 rangées

    async function loadProducts() {
        const category = document.getElementById('category-filter').value;
        const minPrice = document.getElementById('min-price').value;
        const maxPrice = document.getElementById('max-price').value;

        let url = `/api/products?page=${currentPage}&per_page=${perPage}`;
        if (category) url += `&category=${category}`;
        if (minPrice) url += `&min_price=${minPrice}`;
        if (maxPrice) url += `&max_price=${maxPrice}`;

        const response = await fetch(url);
        const data = await response.json();

        // Update subtitle
        const total = data.total || 0;
        document.getElementById('catalog-subtitle').textContent = 
            `${total} jeux disponible - 100% vérifiés et complets`;

        // Render products with home-page card style
        const container = document.getElementById('products-container');
        container.innerHTML = data.products.map(product => {
            const price = Number(product.price || 0);
            const newPrice = price * 2.5;
            const discount = newPrice > 0 ? Math.round(((newPrice - price) / newPrice) * 100) : 0;
            const condition = product.condition || 'Bon état';

            return `
                <a href="/produit/${product.id}" class="home-product-card group">
                    <div class="home-product-media">
                        <span class="home-product-badge home-product-badge-discount">-${discount}%</span>
                        <span class="home-product-badge home-product-badge-condition">${condition}</span>
                        <img src="${product.image_url || '/static/placeholder.svg'}" alt="${product.title}" class="home-product-image" />
                    </div>
                    <div class="home-product-content">
                        <p class="home-product-publisher">${product.publisher || 'Éditeur'}</p>
                        <h3 class="home-product-title">${product.title}</h3>
                        <div class="home-product-meta">
                            <span>${product.number_of_players || '-'} joueurs</span>
                            <span>${product.min_age ? `${product.min_age}+ ans` : 'Âge non précisé'}</span>
                        </div>
                        <div class="home-product-pricing">
                            <div class="home-product-price-row">
                                <span class="home-product-price">${price.toFixed(2)}€</span>
                                <span class="home-product-old-price">${newPrice.toFixed(2)}€</span>
                            </div>
                            <span class="home-product-add">Ajouter</span>
                        </div>
                    </div>
                </a>
            `;
        }).join('');

        // Pagination
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';
        for (let i = 1; i <= data.pages; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            btn.className = i === currentPage
                ? 'px-4 py-2 bg-orange-500 text-white rounded-lg font-semibold transition'
                : 'px-4 py-2 border border-gray-300 rounded-lg hover:border-orange-500 transition';
            btn.onclick = () => {
                currentPage = i;
                loadProducts();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            pagination.appendChild(btn);
        }
    }

    // Filter event listeners
    document.getElementById('category-filter').addEventListener('change', () => {
        currentPage = 1;
        loadProducts();
    });
    
    document.getElementById('min-price').addEventListener('change', () => {
        currentPage = 1;
        loadProducts();
    });
    
    document.getElementById('max-price').addEventListener('change', () => {
        currentPage = 1;
        loadProducts();
    });

    // Mechanic filters
    ['competitif', 'strategie', 'ambiance'].forEach(mechanic => {
        document.getElementById(`mechanic-${mechanic}`).addEventListener('change', () => {
            currentPage = 1;
            loadProducts();
        });
    });

    loadProducts();
</script>
{% endblock %}
